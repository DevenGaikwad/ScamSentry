[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scamsentry-ml"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
description = "Reproducible offline ScamSentry message experiments"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "scikit-learn==1.8.0", "pandas==2.2.3", "joblib==1.5.3", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
