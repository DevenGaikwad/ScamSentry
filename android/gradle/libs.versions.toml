[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.10"
compose-bom = "2026.09.00"
core = "1.17.0"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.9.5"
room = "2.8.5"
datastore = "1.3.0"
coroutines = "1.10.2"
mlkit = "16.0.1"
junit = "4.13.2"
json = "20250517"
exif = "1.4.1"
test-ext = "1.3.0"
test-runner = "1.7.0"
serialization = "1.8.1"

[libraries]
kotlinx-serialization-bom = { module = "org.jetbrains.kotlinx:kotlinx-serialization-bom", version.ref = "serialization" }
compose-window = { module = "androidx.compose.material3:material3-window-size-class", version = "1.4.0" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version = "1.4.1" }
macrobenchmark = { module = "androidx.benchmark:benchmark-macro-junit4", version = "1.5.0" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.3.0" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-room = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3", version = "1.4.0" }
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-tasks = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
mlkit-text = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
androidx-exif = { module = "androidx.exifinterface:exifinterface", version.ref = "exif" }
androidx-test-ext = { module = "androidx.test.ext:junit", version.ref = "test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

[plugins]
android-test = { id = "com.android.test", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
